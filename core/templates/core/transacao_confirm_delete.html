{% extends 'core/base.html' %}

{% block content %}
<div class="card">
    <div class="card-header bg-danger text-white">
        Confirmar Exclusão
    </div>
    <div class="card-body">
        <p>Tem certeza que deseja excluir a transação "{{ object.descricao }}"?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Excluir</button>
            <a href="{% url 'core:transacao_list' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
