{% extends 'core/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Categorias</h2>
    <a href="{% url 'core:categoria_create' %}" class="btn btn-success">Nova Categoria</a>
</div>

<div class="card">
    <div class="card-body">
        <table class="table">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Tipo</th>
                    <th>Cor</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for c in categorias %}
                <tr>
                    <td>{{ c.nome }}</td>
                    <td>{% if c.tipo == 'R' %}Receita{% else %}Despesa{% endif %}</td>
                    <td><span class="badge" style="background-color: {{ c.cor }}">{{ c.cor }}</span></td>
                    <td>
                        <a href="{% url 'core:categoria_update' c.pk %}" class="btn btn-sm btn-primary">Editar</a>
                        <a href="{% url 'core:categoria_delete' c.pk %}" class="btn btn-sm btn-danger">Excluir</a>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="4" class="text-center text-muted">Nenhuma categoria cadastrada.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
