{% extends 'core/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Transações</h2>
    <a href="{% url 'core:transacao_create' %}" class="btn btn-success">Nova Transação</a>
</div>

<div class="card">
    <div class="card-body">
        <table class="table">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Descrição</th>
                    <th>Valor</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for t in transacoes %}
                <tr>
                    <td>{{ t.data|date:"d/m/Y" }}</td>
                    <td>{{ t.descricao }}</td>
                    <td>R$ {{ t.valor|floatformat:2 }}</td>
                    <td>
                        <a href="{% url 'core:transacao_update' t.pk %}" class="btn btn-sm btn-primary">Editar</a>
                        <a href="{% url 'core:transacao_delete' t.pk %}" class="btn btn-sm btn-danger">Excluir</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
